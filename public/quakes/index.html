<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Every M4.5+ earthquake in a year · viz</title>
    <meta name="description" content="Every magnitude 4.5 or larger earthquake USGS recorded in the last twelve months, replayed on a turning globe." />
    <link rel="stylesheet" href="/viz.css" />
    <link rel="stylesheet" href="/quakes/quakes.css" />
    <script type="module" src="/js/pages/quakes.js" blocking="render"></script>
  </head>
  <body>
    <header id="viz-header"></header>
    <main>
      <div class="stage">
        <div class="readout">
          <output id="date-label" aria-live="off"></output>
          <output id="count-label" aria-live="off"></output>
        </div>
        <div class="globe-box">
          <canvas id="globe" role="img" aria-label="A turning globe where each earthquake appears as a ripple sized by magnitude"></canvas>
        </div>
      </div>
      <div class="controls">
        <button id="play" type="button" disabled>Pause</button>
        <label for="min-mag">Min magnitude <output id="mag-label">M4.5+</output></label>
        <input id="min-mag" type="range" min="4.5" max="7.5" step="0.1" value="4.5" autocomplete="off" disabled />
      </div>
      <p class="hint">Drag the globe to turn it.</p>
      <p class="load-error" role="alert" hidden></p>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
